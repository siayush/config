set -g mouse on

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Switch windows with Alt+number (no prefix needed; Option+N in Ghostty)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# I-beam cursor (pass through cursor shape escape sequences)
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[ q"
set -g cursor-style blinking-bar

# ── Dracula theme (matches Ghostty) ──────────────────────────
# bg #282a36 | current-line #44475a | fg #f8f8f2 | comment #6272a4
# cyan #8be9fd | green #50fa7b | purple #bd93f9 | pink #ff79c6

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position bottom

# Status bar base
set -g status-style "bg=#282a36,fg=#f8f8f2"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9]"

# Right: empty
set -g status-right ""

# Windows
set -g window-status-separator ""
set -g window-status-format "#[bg=#282a36,fg=#6272a4] #I #W "
set -g window-status-current-format "#[bg=#44475a,fg=#282a36]#[bg=#44475a,fg=#8be9fd,bold] #I #W #[bg=#282a36,fg=#44475a]"

# Panes
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# Messages
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"
